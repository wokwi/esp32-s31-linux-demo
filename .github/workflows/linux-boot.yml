name: Linux boot test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Boot Linux and run uname
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          scenario: scenarios/linux-boot.test.yaml
          timeout: 30000
          serial_log_file: boot.log

      - name: Show the console log in the job summary
        if: always() && hashFiles('boot.log') != ''
        run: |
          {
            echo '<details><summary>Serial console</summary>'
            echo
            echo '```'
            # drop carriage returns and the terminal escape sequences busybox prints,
            # and end with a newline so the fence below starts on its own line
            sed -e 's/\r$//' -e 's/\x1b\[[0-9;?]*[A-Za-z]//g' -e 's/\x1b[78]//g' -e '$a\' boot.log
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the console log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console
          path: boot.log
